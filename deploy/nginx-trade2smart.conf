# Copy to /etc/nginx/conf.d/trade2smart.conf
# Website files from /var/www/trade2smart (copy of dist; nginx cannot read /root).
# Login/health go to 127.0.0.1:3999 so Chrome can sign in if quotes on :4000 hang.
# Other /api/ goes to Node on 127.0.0.1:4000. Do not send Connection: upgrade on normal pages
# (that made Node reset curl to port 4000).
# install-t2s-service.sh rewrites this file from write_nginx_trade2smart.py.

upstream t2s_api {
    server 127.0.0.1:4000 fail_timeout=3s max_fails=2;
}

upstream t2s_login {
    server 127.0.0.1:3999 fail_timeout=1s max_fails=1;
}

server {
    listen 80;
    listen [::]:80;
    server_name trade2smart.com www.trade2smart.com;

    client_max_body_size 2m;

    location = /api/health {
        proxy_pass http://t2s_login;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_connect_timeout 2s;
        proxy_send_timeout 8s;
        proxy_read_timeout 8s;
    }

    location = /api/login {
        proxy_pass http://t2s_login;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_connect_timeout 2s;
        proxy_send_timeout 8s;
        proxy_read_timeout 8s;
    }

    location ~ ^/api/algos/[^/]+/backtest$ {
        proxy_pass http://t2s_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_connect_timeout 2s;
        proxy_send_timeout 180s;
        proxy_read_timeout 180s;
    }

    location /api/ {
        proxy_pass http://t2s_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_connect_timeout 2s;
        proxy_send_timeout 15s;
        proxy_read_timeout 15s;
    }

    location / {
        root /var/www/trade2smart;
        try_files $uri $uri/ /index.html;
    }
}
