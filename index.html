<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Trade 2 Smart</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <style>
      html,
      body {
        margin: 0;
        background: #1d39c4;
      }
      #t2s-boot {
        min-height: 100vh;
        margin: 0;
        padding: 32px 24px;
        box-sizing: border-box;
        font-family: Inter, system-ui, sans-serif;
        background: #1d39c4;
        color: #fff;
      }
      #t2s-boot h1 {
        margin: 0;
        font-size: 28px;
      }
      #t2s-boot p {
        margin: 12px 0 0;
        line-height: 1.5;
        max-width: 40rem;
      }
      #t2s-boot code {
        background: rgba(255, 255, 255, 0.15);
        padding: 2px 6px;
        border-radius: 6px;
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="t2s-boot">
        <img src="/t2s-logo.png" alt="Trade 2 Smart" width="120" height="120" />
        <h1>Trade 2 Smart</h1>
        <p>Loading the desk…</p>
        <p>
          If this stays here on <b>trade2smart.com</b>, wait 10 seconds and press Ctrl+Shift+R.
          Do not open localhost. On your PC desk only, use
          <code>http://localhost:5173</code> after <code>npm start</code>.
        </p>
      </div>
    </div>
    <script>
      window.addEventListener(
        "error",
        function (event) {
          var root = document.getElementById("root");
          if (!root) return;
          var host = String((location && location.hostname) || "");
          var live = host.indexOf("trade2smart") !== -1;
          var hint = live
            ? "This is the live site. Wait 10 seconds and press Ctrl+Shift+R. Do not open localhost."
            : "In Chrome type http://localhost:5173 and press Enter. Keep npm start open.";
          root.innerHTML =
            '<div id="t2s-boot"><h1>T2S failed to start</h1><p>' +
            String((event && event.message) || "Script error") +
            "</p><p>" +
            hint +
            "</p></div>";
        },
        true,
      );
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
